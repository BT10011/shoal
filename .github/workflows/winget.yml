# Submits a release of shoal to winget, Windows' package manager: writes
# the manifests from the published release and opens a draft pull request
# to microsoft/winget-pkgs from a fork of it. release.yml calls it after
# every release. Run it by hand (Actions, winget, Run workflow) for a
# release published before WINGET_TOKEN existed, such as v2.0.0, or with
# "submit" off to only write the manifests, kept as the run's artifact for
# testing on Windows:
#
#   winget validate --manifest <folder>
#   winget install --manifest <folder>
#
# Secret:
#   WINGET_TOKEN  a classic token with the public_repo scope, belonging to
#                 the account that owns the fork of microsoft/winget-pkgs.
#                 Without it the manifests are written but not submitted,
#                 with a warning.
name: winget

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      submit:
        type: boolean
        default: true
    secrets:
      WINGET_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: The release to submit, such as v2.0.0
        required: true
        type: string
      submit:
        description: Open the pull request (off writes the manifests only)
        type: boolean
        default: true

permissions: {}

jobs:
  winget:
    runs-on: ubuntu-24.04
    permissions:
      contents: read # download the release's checksums
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Write the manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir dist
          date=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json publishedAt --jq '.publishedAt[:10]')
          scripts/winget-manifests.sh "$TAG" dist/SHA256SUMS "$date" "winget/BT10011.Shoal-${TAG#v}"

      - name: Keep the manifests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: winget-manifests-${{ inputs.tag }}
          path: winget/

      - name: Open the pull request
        if: ${{ inputs.submit }}
        env:
          TAG: ${{ inputs.tag }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -z "$WINGET_TOKEN" ]; then
            echo "::warning::WINGET_TOKEN is not set, so $TAG was not submitted to winget. The manifests are kept as this run's artifact."
            exit 0
          fi
          GH_TOKEN=$WINGET_TOKEN scripts/winget-pr.sh "$TAG" "winget/BT10011.Shoal-${TAG#v}"
